# Validates Debian 13 prerequisites, applies package updates, and reboots safely.
- name: Apply system updates
  hosts: all
  gather_facts: true
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:
    - name: Ensure target is Debian 13
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Debian"
          - ansible_distribution_major_version == "13"
        fail_msg: "The cluster host must run Debian 13 (Trixie)"

    - name: Verify passwordless sudo
      ansible.builtin.command: sudo -n true
      become: false
      changed_when: false

    - name: Verify required bootstrap commands
      ansible.builtin.command: "{{ item }} --version"
      loop:
        - python3
        - curl
      changed_when: false

    - name: Verify HTTPS connectivity and DNS
      ansible.builtin.uri:
        url: https://get.k3s.io
        method: HEAD
        status_code: 200
      register: connectivity_check
      retries: 5
      delay: 5
      until: connectivity_check.status == 200

  tasks:
    - name: Update package cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      register: apt_upgrade

    - name: Autoremove unused packages
      ansible.builtin.apt:
        autoremove: true
        purge: true
      when: apt_upgrade.changed

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 600
        msg: "System reboot triggered after Debian package updates"
      when: reboot_required_file.stat.exists

    - name: Ensure SSH recovered after updates
      ansible.builtin.wait_for_connection:
        timeout: 600
