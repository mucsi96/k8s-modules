# Gives k3s and pods a resolver file containing real upstream nameservers.
- name: Configure systemd-resolved as the host DNS resolver
  hosts: all
  gather_facts: true
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Ensure systemd-resolved is installed
      ansible.builtin.apt:
        name: systemd-resolved
        state: present
        update_cache: true

    - name: Ensure systemd-resolved is enabled and running
      ansible.builtin.systemd_service:
        name: systemd-resolved
        enabled: true
        state: started

    - name: Ensure systemd-resolved drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure upstream DNS servers
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/upstream.conf
        content: |
          [Resolve]
          DNS=
          DNS=46.38.225.230 46.38.252.230
          FallbackDNS=
          FallbackDNS=1.1.1.1 9.9.9.9
        owner: root
        group: root
        mode: "0644"
      notify:
        - Restart systemd-resolved
        - Schedule Twingate connector restart

    - name: Point host resolv.conf at systemd-resolved
      ansible.builtin.file:
        src: /run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
        follow: false
      notify: Schedule Twingate connector restart

    - name: Ensure Twingate systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/twingate-connector.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Order Twingate after network and DNS
      ansible.builtin.copy:
        dest: /etc/systemd/system/twingate-connector.service.d/10-network-online.conf
        content: |
          [Unit]
          Wants=network-online.target systemd-resolved.service
          After=network-online.target systemd-resolved.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Schedule Twingate connector restart

    - name: Apply resolver configuration
      ansible.builtin.meta: flush_handlers

    - name: Reset the SSH connection before the scheduled restart
      ansible.builtin.meta: reset_connection

    - name: Wait for Twingate SSH to recover
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

    - name: Verify Twingate connector health
      ansible.builtin.command: twingate-connectorctl health
      register: twingate_health
      retries: 30
      delay: 2
      until: twingate_health.rc == 0
      changed_when: false

    - name: Verify DNS resolution
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-connectivity-check
        mode: "0600"

    - name: Remove connectivity check
      ansible.builtin.file:
        path: /tmp/k3s-connectivity-check
        state: absent

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted

    - name: Schedule Twingate connector restart
      ansible.builtin.command:
        argv:
          - systemd-run
          - --on-active=5s
          - --collect
          - /usr/bin/systemctl
          - restart
          - twingate-connector.service
